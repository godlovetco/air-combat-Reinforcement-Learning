name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Python distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Assemble end-user install bundle
        run: |
          ver="${GITHUB_REF_NAME:-dev}"
          stage="ucav-ai-pilot-${ver}"
          mkdir -p "$stage"
          cp -r dcs_bridge dcs-addon checkpoints docs "$stage"/
          cp README.md CHANGELOG.md LICENSE requirements.txt install.bat "$stage"/
          find "$stage" -name '__pycache__' -type d -prune -exec rm -rf {} +
          zip -r "${stage}.zip" "$stage" >/dev/null
          echo "Built ${stage}.zip"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/*
            ucav-ai-pilot-*.zip
